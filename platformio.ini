[platformio]
default_envs = x4-pro
extra_configs = platformio.local.ini

[crossdito]
version = 1.5.1

; Legacy CROSSINK_* compile symbols and /.crosspoint storage paths are kept so
; existing settings, reading progress, caches, and external integrations remain
; compatible after the product rename.

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000

; Rebuild the Arduino/ESP-IDF SDK with CrossDiTo's X4 Pro resource policy.
; Timer stacks remain above their measured high-water marks; disabling Wi-Fi
; IRAM placement trades some throughput for usable heap. The final power and
; memory settings below were reintroduced one at a time and verified on an X4
; Pro, including unplugged light-sleep wake behavior.
custom_sdkconfig =
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_PM_ENABLE=y
  CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n

; These managed ESP-IDF components support Arduino cloud, diagnostics, and
; radio-co-processor features that CrossDiTo does not use.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

build_flags =
  -Iinclude
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
; Keep the app header and pioarduino's precompiled SDK on the same proven DIO
; variant. The X4 Pro's PSRAM remains Octal; only external flash uses DIO.
board_build.flash_mode = dio
board_build.memory_type = dio_opi
board_build.arduino.memory_type = dio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_web.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_websockets.py
  post:scripts/check_firmware_size.py
  post:scripts/check_app_touch_gate.py
  post:scripts/rename_firmware.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  NearbyTransfer=symlink://freeink-sdk/libs/network/NearbyTransfer
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE
  HalClockSim

[simulator-base]
platform = native
custom_run_simulator_target_owner = project
lib_compat_mode = off
build_src_filter =
  +<*>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -DSIMULATOR
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -Wno-c++11-narrowing
  -DCROSSINK_VERSION=\"${crossdito.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Iinclude
  -Isrc
  ;-DOMIT_EMOJI_FONTS ; uncomment to omit emoji/symbols glyphs from reading fonts
  -DCROSSPOINT_SIM_USE_NATIVE_DECODERS
  -Dmemcpy_P=memcpy ; For native JPEGDEC
lib_ignore = hal, WebSockets
extra_scripts =
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_web.py
  post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  simulator=https://github.com/uxjulia/crossink-simulator
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  NearbyTransfer=symlink://freeink-sdk/libs/network/NearbyTransfer
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

; --- Xteink X4 Pro simulator -----------------------------------------------
; Use the simulator's native X4 Pro profile so it exposes its Home key and
; PWM frontlight capabilities.
[env:x4-pro-simulator]
extends = simulator-base
build_flags =
  ${simulator-base.build_flags}
  -DSIMULATOR_DEVICE_X4_PRO
  -DCROSSINK_APP_CAP_TOUCH=1
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x4-pro\"
;   pio run -e x4-pro-simulator -t run_simulator

; --- Xteink X4 Pro - ESP32-S3R8, 4.3" 800x480 + SDMMC ------------------------
; CrossDiTo ships only for this S3/PSRAM board profile, using an independent
; SDMMC storage bus.
;   pio run -e x4-pro -t upload
[env:x4-pro]
extends = base
custom_firmware_device_type = x4-pro
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DCROSSINK_APP_CAP_TOUCH=1
  -DFREEINK_FB_PSRAM=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x4-pro\"
  -DCROSSDITO_INPUT_IDLE_WAIT=1
  -DFREEINK_GT911_IRQ_GATING=1
  -DENABLE_RTC_LOG
  -DLOG_LEVEL=1

[env:x4-pro-debug]
extends = base
custom_firmware_device_type = x4-pro
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DCROSSINK_APP_CAP_TOUCH=1
  -DFREEINK_FB_PSRAM=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; CROSSINK_VERSION injected by scripts/git_branch.py
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x4-pro\"
  -DCROSSDITO_INPUT_IDLE_WAIT=1
  -DFREEINK_GT911_IRQ_GATING=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

; Hardware-safe diagnostic build. This keeps the optimized application code,
; but restores the known-good boot/runtime electrical settings so each power
; optimization can be reintroduced and hardware-tested independently.
[env:x4-pro-stage1]
extends = base
custom_firmware_device_type = x4-pro-stage1
board_build.flash_mode = dio
; Pin the precompiled Arduino/ESP-IDF libraries as well as the image header.
; Without this, pioarduino can reuse the board's default qio_opi SDK cache.
board_build.memory_type = dio_opi
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_PM_ENABLE=n
  CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP=n
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=n
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=n
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DCROSSINK_APP_CAP_TOUCH=1
  -DFREEINK_FB_PSRAM=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x4-pro\"
  -DCROSSDITO_INPUT_IDLE_WAIT=0
  -DFREEINK_GT911_IRQ_GATING=0
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

; Stage 2 adds only the HAL/SDK input-idle optimizations to the proven Stage 1
; application. Automatic PM, tickless light sleep, QIO, and 40 MHz EPD SPI stay
; disabled so input wake behavior is the sole hardware variable.
[env:x4-pro-stage2]
extends = base
custom_firmware_device_type = x4-pro-stage2
board_build.flash_mode = dio
board_build.memory_type = dio_opi
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_PM_ENABLE=n
  CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP=n
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=n
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=n
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DCROSSINK_APP_CAP_TOUCH=1
  -DFREEINK_FB_PSRAM=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x4-pro\"
  -DCROSSDITO_INPUT_IDLE_WAIT=1
  -DFREEINK_GT911_IRQ_GATING=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

; Stage 3 adds dynamic frequency scaling and standard automatic light sleep to
; the hardware-tested Stage 2 input path. CPU-domain power-down, QIO, the 40 MHz
; EPD bus, and the internal-memory reserve remain disabled and independent.
[env:x4-pro-stage3]
extends = base
custom_firmware_device_type = x4-pro-stage3
board_build.flash_mode = dio
board_build.memory_type = dio_opi
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_PM_ENABLE=y
  CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP=n
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DCROSSINK_APP_CAP_TOUCH=1
  -DFREEINK_FB_PSRAM=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x4-pro\"
  -DCROSSDITO_INPUT_IDLE_WAIT=1
  -DFREEINK_GT911_IRQ_GATING=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

; Stage 4 adds ESP32-S3 CPU-domain power-down during automatic light sleep to
; the hardware-tested Stage 3 configuration. Espressif documents an ~650 uA
; light-sleep reduction at the cost of retention RAM. QIO, the 40 MHz EPD bus,
; and the internal-memory reserve remain disabled and independent.
[env:x4-pro-stage4]
extends = base
custom_firmware_device_type = x4-pro-stage4
board_build.flash_mode = dio
board_build.memory_type = dio_opi
board_build.arduino.memory_type = dio_opi
custom_sdkconfig =
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_PM_ENABLE=y
  CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DCROSSINK_APP_CAP_TOUCH=1
  -DFREEINK_FB_PSRAM=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x4-pro\"
  -DCROSSDITO_INPUT_IDLE_WAIT=1
  -DFREEINK_GT911_IRQ_GATING=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
