name: Compile CrossDiTo Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-candidate:
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    env:
      RC_BRANCH: ${{ github.ref_name }}
      RC_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Resolve release-candidate metadata
        shell: bash
        run: |
          branch_without_prefix="${RC_BRANCH#release/}"
          branch_safe=$(printf '%s\n' "$branch_without_prefix" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          hash_short="${RC_HASH::7}"
          rc_tag="rc-${branch_safe}-${hash_short}"
          echo "RC_BRANCH_RAW=$branch_without_prefix" >> "$GITHUB_ENV"
          echo "RC_BRANCH_SAFE=$branch_safe" >> "$GITHUB_ENV"
          echo "RC_HASH_SHORT=$hash_short" >> "$GITHUB_ENV"
          echo "RC_TAG=$rc_tag" >> "$GITHUB_ENV"
          echo "VERSION=${branch_safe}-RC" >> "$GITHUB_ENV"

      - name: Set base version from branch
        shell: bash
        run: |
          escaped_version=$(printf '%s\n' "$RC_BRANCH_SAFE" | sed 's/[&|]/\\&/g')
          sed -i "/^\[crossdito\]$/,/^\[/s|^version = .*|version = ${escaped_version}|" platformio.ini

      - name: Build CrossDiTo for X4 Pro
        shell: bash
        env:
          CROSSINK_RC_ARTIFACTS: "1"
          CROSSINK_RC_BRANCH: ${{ env.RC_BRANCH_RAW }}
          CROSSINK_RC_HASH: ${{ env.RC_HASH_SHORT }}
        run: pio run -e x4-pro

      - name: Create GitHub RC Prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RC_TAG }}
          target_commitish: ${{ github.sha }}
          name: CrossDiTo RC ${{ env.RC_BRANCH_SAFE }} ${{ env.RC_HASH_SHORT }}
          body: |
            Draft release candidate build from `release/${{ env.RC_BRANCH_RAW }}` at `${{ env.RC_HASH_SHORT }}`.
          draft: true
          prerelease: true
          files: |
            .pio/build/x4-pro/CrossDiTo-x4-pro-${{ env.RC_BRANCH_SAFE }}-${{ env.RC_HASH_SHORT }}-RC.bin
